let G={};
const stBack=(t,f)=>`<button class="back" onclick="${f}">← ${t}</button>`;
function sci(){const b=`st.v='topic';render()`;
 if(st.v=="exam")return mockV();
 if(st.v=="slides")return slidesV();
 if(st.v=="lesson")return lessonV();if(st.v=="video")return videoV();if(st.v=="quiz")return quizV();if(st.v=="game")return gameV();
 if(st.v=="empty")return emptyV();
 if(st.v=="topic")return `${stBack("Term "+st.sterm+" lessons","st.v=null;render()")}<div class="card"><h3>🌿 Week 1: Living and Non-living Things</h3><p class="mute">Primary 3 · Basic Science & Technology</p></div>
 <button class="go alt" onclick="st.v='lesson';st.step=0;render()">📖 1. Learn the lesson</button><button class="go grn" onclick="st.v='video';render()">🎬 2. Watch the video</button>
 <button class="go" onclick="st.v='quiz';st.q=0;st.sc=0;render()">📝 3. Take the quiz</button><button class="go alt" onclick="startGame()">🎮 4. Play the game</button>`;
 if(st.sterm)return termV();
 return `<h2>🔬 Science · Primary 3</h2><p class="mute">Choose your term</p>${[[1,"🌱","#5E5CE6","#BF9BFF"],[2,"☀️","#FF9F0A","#FF4F81"],[3,"🌳","#30D158","#40CBE0"]].map(t=>`<button onclick="st.sterm=${t[0]}; render()" style="display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:22px;padding:26px 20px;margin-bottom:14px;color:#fff;font:inherit;text-align:left;cursor:pointer;background:linear-gradient(135deg,${t[2]},${t[3]});box-shadow:0 10px 22px rgba(30,30,70,.22),inset 0 1px 0 rgba(255,255,255,.42)"><span style="font-size:48px">${t[1]}</span><span><b style="font-size:26px">Term ${t[0]}</b><br><span style="opacity:.95">10 weeks · 30 lessons</span></span></button>`).join("")}`}
const termTabs=()=>`<div class="tt">${[1,2,3].map(t=>`<button class="${st.term==t?"on":""}" onclick="st.term=${t};st.v=null;render()">Term ${t}</button>`).join("")}</div>`;
function termV(){const t=st.sterm;
 return `<button class="back" onclick="st.sterm=null;render()">← All terms</button><h2>Term ${t} · Science</h2><div class="grid">${Array.from({length:30},(_,i)=>{const n=i+1,w=Math.ceil(n/3),open=t==1&&n<=30;
  return `<button class="tile" style="background:${open?"#30D158":colors[w%10]}" onclick="openL(${n})"><span class="e">${open?LS[n].ic:"📖"}</span>Lesson ${n}<small>${open?LS[n].st:"Week "+w}</small></button>`}).join("")}</div>${examBar(t)}`}
function openL(n){st.l=n;st.si=0;st.v=(st.sterm==1&&n<=30)?"slides":"empty";render()}
function emptyV(){const n=st.l,w=Math.ceil(n/3);
 return `${stBack("Term "+st.sterm+" lessons","st.v=null;render()")}<div class="card"><h3>📖 Lesson ${n} · Week ${w} · Term ${st.sterm}</h3><span class="soon">Coming soon</span><p>The lesson, video, quiz and game for this lesson will appear here.</p></div>`}
function lessonV(){const l=lessonS[st.step],n=lessonS.length;
 return `${stBack("Week 1","st.v='topic';render()")}<div class="card"><div class="mute">Step ${st.step+1} of ${n}</div><div class="bar"><i style="width:${(st.step+1)/n*100}%"></i></div><h3 style="margin-top:12px">${l.t}</h3>${l.h}</div>
 <div class="row">${st.step?`<button class="go alt" onclick="st.step--;render()">← Back</button>`:""}${st.step<n-1?`<button class="go" onclick="st.step++;render()">Next →</button>`:`<button class="go grn" onclick="st.v='quiz';st.q=0;st.sc=0;render()">Start quiz 📝</button>`}</div>`}
function videoV(){const on=navigator.onLine;let x;
 if(VIDEO_FILE)x=`<video controls playsinline preload="none" style="width:100%;border-radius:14px;background:#000" src="${VIDEO_FILE}"></video>`;else if(!VIDEO_ID)x=`<div class="vid">🎬<p>Your lesson video will play right here in the app.</p><small>Add a YouTube video ID in the code.</small></div>`;
 else if(!on)x=`<div class="vid">📶<p>Connect to the internet to watch this video.</p></div>`;
 else x=`<div id="vp" class="vid" onclick="playV()" style="background:#2B2D42 url(https://i.ytimg.com/vi/${VIDEO_ID}/hqdefault.jpg) center/cover"><span style="font-size:64px">▶️</span></div>`;
 return `${stBack("Week 1","st.v='topic';render()")}<div class="card"><h3>🎬 Watch and learn</h3>${x}${VIDEO_ID?`<a class="go grn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${VIDEO_ID}">If it does not play, open on YouTube</a>`:""}<p class="mute">The lesson and quiz still work without internet.</p></div>`}
function playV(){$("#vp").outerHTML=`<iframe class="vid" title="Lesson video" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${VIDEO_ID}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`}
function quizV(){
 if(st.q>=quizS.length){const n=st.sc;return `<div class="card" style="text-align:center"><div class="emo">${n>=3?"🏆":"💪"}</div><h3>${n>=3?"Well done!":"Good try!"}</h3><p class="big">You got <b>${n} / ${quizS.length}</b> and won <b>${n} ⭐</b></p></div><button class="go" onclick="st.q=0;st.sc=0;render()">Try again 🔁</button><button class="go alt" onclick="st.v='topic';render()">Back to Week 1</button>`}
 const [q,a,o]=quizS[st.q];
 return `${stBack("Quit quiz","st.v='topic';render()")}<div class="card"><div class="mute">Question ${st.q+1} of ${quizS.length}</div><div class="bar"><i style="width:${st.q/quizS.length*100}%"></i></div><p class="big"><b>${q}</b></p><div class="opts" id="opts">${shuffle(o).map(x=>`<button class="opt" onclick="qAns(this,'${x}','${a}')">${x}</button>`).join("")}</div></div>`}
function qAns(b,x,a){document.querySelectorAll("#opts .opt").forEach(e=>{e.disabled=true;if(e.textContent==a)e.classList.add("ok")});if(x==a)st.sc++;else b.classList.add("no");setTimeout(()=>{st.q++;render()},1000)}
let BEST=0;
const LIV=[["Goat","🐐"],["Hen","🐓"],["Mango tree","🌳"],["Cow","🐄"],["Fish","🐟"],["Child","👧"],["Maize plant","🌽"],["Dog","🐕"],["Butterfly","🦋"],["Flower","🌻"]];
const NON=[["Stone","🪨"],["Brick","🧱"],["Chair","🪑"],["Football","⚽"],["Phone","📱"],["Bucket","🪣"],["Book","📕"],["Umbrella","☂️"],["Key","🔑"]];
function stopGame(){cancelAnimationFrame(G.raf);document.removeEventListener("keydown",gKey)}
function startGame(){stopGame();G={};st.v="game";render()}
function gKey(e){if(e.key=="ArrowLeft")mv(-1);if(e.key=="ArrowRight")mv(1)}
function mv(d){if(G.go&&!G.over)G.lane=Math.max(0,Math.min(2,G.lane+d))}
function gameV(){const back=st.tab=="games"?"st.v=null;render()":"st.v='topic';render()";
 if(G.over)return `<div class="card" style="text-align:center"><div style="font-size:64px">${G.score>=100?"🏆":"🏁"}</div><h3>${G.score>=100?"Science Star!":"Game over!"}</h3><p class="big">Score: <b>${G.score}</b> · Best: <b>${BEST}</b></p><p>✅ Living things collected: <b>${G.liv}</b><br>❌ Non-living things hit: <b>${G.hit}</b></p></div>
 <div class="card"><h3>🔬 Remember</h3><p>Living things <b>grow, eat, breathe and have babies</b>. Non-living things do not.</p></div><button class="go" onclick="beginGame()">Race again 🔁</button><button class="go alt" onclick="${back}">Back</button>`;
 if(!G.go)return `${stBack("Back",back)}<div class="card" style="text-align:center"><div style="font-size:54px">🏎️</div><h3>Life Racer</h3><p class="big">Drive on the road!</p><p class="big">✅ <b>Collect LIVING things</b> 🐐🌳🐓<br>to score points and win extra lives ❤️</p><p class="big">❌ <b>Dodge NON-LIVING things</b> 🪨🪑⚽<br>Hit 5 and it is game over!</p><p class="mute">Tap the left or right side of the road, use the buttons, or the arrow keys.</p><button class="go" onclick="beginGame()">Start the race! 🚦</button></div>`;
 return `${stBack("Quit game",back)}<canvas id="cv" style="display:block;margin:0 auto;border-radius:16px;touch-action:none"></canvas><div class="row" style="margin-top:10px"><button class="go alt" style="margin:0" onclick="mv(-1)">◀ Left</button><button class="go alt" style="margin:0" onclick="mv(1)">Right ▶</button></div>`}
function beginGame(){stopGame();G={go:1,lane:1,items:[],lives:5,score:0,liv:0,hit:0,t:0,spawn:.6,off:0,msg:"",msgT:0,ok:true,over:false};st.v="game";render();
 const cv=$("#cv"),dpr=window.devicePixelRatio||1;G.W=Math.min(460,innerWidth-32);G.H=Math.min(Math.round(G.W*1.35),Math.max(300,innerHeight-250));
 cv.width=G.W*dpr;cv.height=G.H*dpr;cv.style.width=G.W+"px";cv.style.height=G.H+"px";G.c=cv.getContext("2d");G.c.setTransform(dpr,0,0,dpr,0,0);
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();mv(e.clientX-r.left<G.W/2?-1:1)};
 document.addEventListener("keydown",gKey);G.last=performance.now();G.raf=requestAnimationFrame(loop)}
function loop(ts){const dt=Math.min(.05,(ts-G.last)/1000);G.last=ts;gUpdate(dt);gDraw();
 if(G.lives<=0){G.over=true;BEST=Math.max(BEST,G.score);setTimeout(()=>{if(st.v=="game")render()},700)}else G.raf=requestAnimationFrame(loop)}
function gUpdate(dt){G.t+=dt;G.sp=Math.min(380,170+G.t*5);G.off=(G.off+G.sp*dt)%40;G.spawn-=dt;G.msgT-=dt;
 if(G.spawn<=0){const l=Math.random()<.5,a=l?LIV:NON,it=a[Math.random()*a.length|0];G.items.push({n:it[0],e:it[1],l,lane:Math.random()*3|0,y:-30});G.spawn=Math.max(.7,1.1-G.t*.006)}
 const cy=G.H-70;
 for(const it of G.items){it.y+=G.sp*dt;
  if(!it.d&&it.lane==G.lane&&Math.abs(it.y-cy)<40){it.d=1;
   if(it.l){G.score+=10;G.liv++;G.msg=it.n+" is LIVING! +10";G.ok=true;if(G.liv%3==0&&G.lives<7){G.lives++;G.msg+="  +1 ❤️"}}
   else{G.lives--;G.hit++;G.msg=it.n+" is NON-living! -1 ❤️";G.ok=false}
   G.msgT=1.3}}
 G.items=G.items.filter(i=>!i.d&&i.y<G.H+40)}
function gDraw(){const c=G.c,W=G.W,H=G.H,lw=W/3;
 c.fillStyle="#3d405b";c.fillRect(0,0,W,H);
 c.strokeStyle="#fff";c.lineWidth=3;c.setLineDash([20,20]);c.lineDashOffset=-G.off;
 for(let i=1;i<3;i++){c.beginPath();c.moveTo(lw*i,0);c.lineTo(lw*i,H);c.stroke()}c.setLineDash([]);
 c.textAlign="center";c.textBaseline="middle";c.font="40px serif";
 for(const it of G.items)c.fillText(it.e,lw*it.lane+lw/2,it.y);
 const x=lw*G.lane+lw/2,y=H-70;
 c.fillStyle="#e63946";c.beginPath();c.roundRect(x-18,y-30,36,60,9);c.fill();
 c.fillStyle="#a8dadc";c.fillRect(x-13,y-18,26,14);c.fillRect(x-13,y+8,26,10);
 c.fillStyle="#111";for(const [dx,dy] of [[-21,-20],[16,-20],[-21,12],[16,12]])c.fillRect(x+dx,y+dy,5,14);
 c.fillStyle="#FFD60A";c.fillRect(x-14,y-31,8,4);c.fillRect(x+6,y-31,8,4);
 c.font="20px serif";c.textAlign="left";c.fillStyle="#fff";c.fillText("❤️".repeat(G.lives),8,20);
 c.textAlign="right";c.font="bold 18px sans-serif";c.fillText("⭐ "+G.score,W-8,20);
 if(G.msgT>0){c.globalAlpha=Math.min(1,G.msgT*2);c.fillStyle=G.ok?"#30D158":"#FF6B4A";c.beginPath();c.roundRect(W/2-120,36,240,32,16);c.fill();c.fillStyle="#fff";c.textAlign="center";c.font="bold 14px sans-serif";c.fillText(G.msg,W/2,52);c.globalAlpha=1}}
function bind(){
 document.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{if(b.dataset.cls=="P3"){st.cls="P3";render()}});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.subj=+b.dataset.s;render()});
}
render();
</script></body></html>
